gates:
  read:
    stages:
      - ingest
      - layers
      - qa
      - check
      - close
    require:
      layers:
        - artifact:layer_card
      close:
        - artifact:check_result
    approve: user
engines: {}
delegations:
  accepts: []
  sends: []
cards:
  layer: { schema: schemas/research/layer.json, ui: LayerCard, tool: read_layer_write }
  quiz: { schema: schemas/research/quiz.json, ui: QuizCard, tool: read_quiz_write }
  finding: { schema: schemas/research/finding.json, ui: FindingCard, tool: finding_record }
  answer: { schema: schemas/research/answer.json, ui: AnswerCard, tool: card_answer }
budget:
  default_cny: 5
  by_mode:
    read: 5
    swarm: 30
    auto: null
tunable:
  - model_slots.*
  - budget.*
  - roles.*.tools.*:tighten_only
metadata:
  migration_source: 202610190002_roles.sql and original services/control/roles bytes
  gate_source: Read stages newly declared from HARNESS.md example; swarm/auto stages remain unspecified.
  memory_write_scope: Original role seeds have no independent memory write scope; conservatively empty until P1-11.
  planned_capabilities: Business tool contracts are declared planned; cards/MCP/delegation execution
    is not implemented by this manifest.
