services:
  db:
    # 只给测试用的一次性库：能力面和本机 Supabase 对齐（vector + postgis + pgrouting）。
    build:
      context: ./db
      dockerfile: Dockerfile.test
    image: reinlab-pg-test:pg16-postgis-pgrouting
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_DB: reinlab_test
      POSTGRES_USER: postgres
      # 仅回环端口的可丢弃测试数据库；业务隔离仍强制使用非特权应用角色与RLS。
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d reinlab_test']
      interval: 2s
      timeout: 2s
      retries: 30
