name: Research foundation
on:
  push:
    branches: ['codex/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: reinlab_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reinlab_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      VITE_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: 依赖边界
        run: pnpm lint
      - name: 测试
        run: pnpm test --reporter=json --outputFile=test-report.json
      - name: 共享契约类型检查
        run: pnpm exec tsc -p packages/contracts/tsconfig.json
      - name: 控制面类型检查
        run: pnpm exec tsc -p services/control/tsconfig.json
      - name: 本地编排类型检查
        run: pnpm exec tsc --noEmit --strict --skipLibCheck --esModuleInterop --moduleResolution bundler --module ESNext --target ES2022 --lib ES2022,DOM --types node tooling/local/up.ts
      - name: mock 构建
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-test-report
          path: test-report.json
  account-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 构建真实账户镜像
        run: docker build -f infra/fly/account.Dockerfile -t reinlab-account:p1-08 .
      - name: 真实容器、root新卷、认证、工具与重启验证
        run: node services/account-runtime/verify-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-container-test-report
          path: container-test-report.json
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: 完整本地Supabase与真实账户镜像
        run: pnpm local:up
      - name: Auth、Vault、Storage与账户容器真实集成
        run: pnpm local:verify
        env:
          REINLAB_EVIDENCE_OUT: ${{ runner.temp }}/local-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-infrastructure-test-report
          path: ${{ runner.temp }}/local-integration/*.json
