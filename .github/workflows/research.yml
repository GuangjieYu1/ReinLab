name: Research foundation
on:
  push:
    branches: ["codex/**"]
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: reinlab_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reinlab_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      VITE_BACKEND: mock
      REINLAB_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: 依赖边界
        run: pnpm lint
      - name: PDF 文本层依赖
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: 凭据扫描器（仅合成 fixture）
        run: python3 tooling/security/test-scan.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 构建固定源码与文件鉴权部署适配器
        run: node services/account-runtime/build.mjs
      - name: 前端构建后原生回归（缺失禁止跳过）
        run: pnpm test:native-after-build
        env:
          REINLAB_NATIVE_REPORT: native-after-build-report.json
      - name: 测试
        run: pnpm test --reporter=json --outputFile=test-report.json
      - name: 共享契约类型检查
        run: pnpm exec tsc -p packages/contracts/tsconfig.json
      - name: 控制面类型检查
        run: pnpm exec tsc -p services/control/tsconfig.json
      - name: 本地编排类型检查
        run: pnpm exec tsc --noEmit --strict --skipLibCheck --esModuleInterop --moduleResolution bundler --module ESNext --target ES2022 --lib ES2022,DOM --types node tooling/local/up.ts
      - name: mock 构建
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-test-report-node-${{ matrix.node }}
          path: |
            test-report.json
            native-after-build-report.json
  account-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建真实账户镜像
        run: docker build -f infra/fly/account.Dockerfile -t reinlab-account:p1-08 .
      - name: 真实容器、root新卷、认证、工具与重启验证
        run: node services/account-runtime/verify-container.mjs
      - name: MCP Linux 原子文件、stdio 和私有配置验证
        run: node services/account-runtime/verify-mcp-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-container-test-report
          path: |
            container-test-report.json
            mcp-container-test-report.json
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: 完整本地Supabase与真实账户镜像
        run: pnpm local:up
      - name: Auth、Vault、Storage与账户容器真实集成
        run: pnpm local:verify
        env:
          REINLAB_EVIDENCE_OUT: ${{ runner.temp }}/local-integration
      - name: 安装浏览器（仅测试隔离浏览器）
        run: pnpm exec playwright install --with-deps chromium
      - name: P1-12 真实本地Auth/API/浏览器（模型0调用）
        run: |
          VITE_BACKEND=live pnpm dev --port 5181 > /tmp/reinlab-live-vite.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:5181/ > /dev/null && break; sleep 1; done
          pnpm exec tsx services/control/scripts/verify-inbox-live.ts
        env:
          REINLAB_EVIDENCE_OUT: ${{ runner.temp }}/local-inbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-infrastructure-test-report
          path: |
            ${{ runner.temp }}/local-integration/*.json
            ${{ runner.temp }}/local-inbox/*
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BACKEND: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 原样18场景T-REG
        run: |
          pnpm dev > /tmp/reinlab-mock-vite.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          pnpm e2e:legacy
        env:
          E2E_OUT: ${{ runner.temp }}/legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-t-reg
          path: ${{ runner.temp }}/legacy
