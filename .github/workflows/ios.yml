name: iOS unsigned ipa

# 产出未签名的 .ipa 供本机自签装机。
#
# 为什么是「未签名」：免费 Apple ID 无法创建 App Store Connect API Key，
# CI 拿不到签名身份，因此云端不可能替你签名。签名在下载后由
# Sideloadly / SideStore 用你的 Apple ID 在本机完成。

on:
  workflow_dispatch:
  push:
    branches: [ios/capacitor, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 环境信息
        run: |
          node -v
          npm -v
          xcodebuild -version

      - name: 安装依赖
        run: npm ci

      # 75 个测试很快（约 0.4s），作为构建门禁。
      - name: 测试
        run: npm test

      - name: 构建 Web 产物
        run: npm run build

      - name: 同步到 iOS 工程
        run: npx cap sync ios

      - name: 构建未签名 .app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            build

      - name: 打包为 .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "未找到构建产物 $APP"; exit 1; }
          echo "产物架构："
          lipo -info "$APP/App" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ReinLab-unsigned.ipa Payload
          ls -lh ReinLab-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ReinLab-unsigned-ipa
          path: ReinLab-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
